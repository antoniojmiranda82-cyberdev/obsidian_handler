services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${username}
      COUCHDB_PASSWORD: ${password}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  obsidian-handler:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      hostname: http://couchdb:5984
      dbname: ${dbname}
      username: ${username}
      password: ${password}
      passphrase: ${passphrase}
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_TRANSPORT: http
      MCP_PORT: 3100
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-mxbai-embed-large:latest}
      OLLAMA_GENERATE_URL: ${OLLAMA_GENERATE_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://host.docker.internal:11434/api/embed}
      OLLAMA_TAGS_URL: ${OLLAMA_TAGS_URL:-http://host.docker.internal:11434/api/tags}
      OBSIDIAN_PROJECT_ROOT: ${OBSIDIAN_PROJECT_ROOT:-Projects/qst}
      ASSET_DREAM_ROOT: ${ASSET_DREAM_ROOT:-Projects/asset-dream}
      OBSIDIAN_INBOX_DIR: ${OBSIDIAN_INBOX_DIR:-01 - Inbox}
      OBSIDIAN_SCHEMA_FILE: ${OBSIDIAN_SCHEMA_FILE:-SCHEMA.md}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  couchdb-data:
